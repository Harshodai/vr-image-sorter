version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        USE_GPU: "false" # Set to "true" for GPU build
    ports:
      - "${PORT:-8001}:8000"
    volumes:
      - ./temp_logs:/app/temp_logs
    environment:
      # SESSION_SECRET_KEY: override with a strong random secret in production.
      # Generate one with: python3 -c "import secrets; print(secrets.token_hex(32))"
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY:-vr-sorter-local-docker-secret-change-in-prod-32x}
      - APP_ENV=${APP_ENV:-development}
    restart: always


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: "http://localhost:${PORT:-8001}"
    ports:
      - "${UI_PORT:-8088}:8080"
    environment:
      - VITE_API_URL=http://localhost:${PORT:-8001}
    depends_on:
      - backend
    restart: always
